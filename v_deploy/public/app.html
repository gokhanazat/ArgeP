<!DOCTYPE html>
<html lang="tr">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argep - Araştırma Yönetim Paneli</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1B2D4D;
        }

        #compose-target {
            width: 100%;
            height: 100%;
        }

        .back-to-landing {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 99;
            color: #94A3B8;
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(27, 45, 77, 0.85);
            backdrop-filter: blur(8px);
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.2s;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .back-to-landing:hover {
            color: white;
            background: rgba(15, 23, 42, 0.95);
            border-color: rgba(225, 167, 48, 0.5);
        }

        /* Loading Spinner */
        .loading-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #FFFFFF;
            background-color: #1B2D4D;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 100;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #E1A730;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <a href="/" class="back-to-landing">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Ana Sayfa
    </a>
    <div id="loading" class="loading-container">
        <div class="spinner"></div>
        <div style="font-size: 15px; letter-spacing: 0.5px;">Argep Yükleniyor...</div>
    </div>
    <canvas id="compose-target"></canvas>
    <script type="application/javascript" src="skiko.js"></script>
    <script type="application/javascript" src="webApp.js"></script>
    <script>
        const observer = new MutationObserver(function() {
            var canvas = document.getElementById('compose-target');
            if (canvas && canvas.width > 0) {
                var l = document.getElementById('loading');
                if (l) l.style.display = 'none';
                observer.disconnect();
            }
        });
        observer.observe(document.body, { childList: true, subtree: true });
    </script>
</body>
</html>
